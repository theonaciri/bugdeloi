name: Vérification
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bugdeloi_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres -d bugdeloi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/bugdeloi_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Préparer la base de test
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d bugdeloi_test \
            -c 'CREATE EXTENSION ltree' -c 'CREATE EXTENSION pg_trgm' -c 'CREATE EXTENSION unaccent'
          DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - run: bun run verify
      - name: Build et smoke test HTTP 200
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          bun run --filter @bugdeloi/web build
          bun run smoke:web
