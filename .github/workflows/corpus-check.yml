name: Vérification du corpus Catala

on:
  pull_request:
    paths:
      - "corpus/**"
      - "scripts/check-corpus-pr.ts"
  push:
    branches: [main, j0-fondations]
    paths:
      - "corpus/**"
      - "scripts/check-corpus-pr.ts"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Contrôle N1 (en-têtes LEGIARTI et anti-doublon)
        run: bun scripts/check-corpus-pr.ts

      - name: Contrôle N2 (clerk test dans Catala 1.3.2)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/bugdeloi-catala@sha256:5f3f6572d073596f3f2b4b3b3ac6205f3743a7bf9cf81720c4d46744f7e48328"
          FILES=$(cd corpus && find . -name '*.catala_fr' | sed 's|^\./||' | sort | tr '\n' ' ')
          docker run --rm --network=none \
            --tmpfs /build:rw,exec,mode=1777 \
            -e CLERK_BUILD_DIR=/build -e CLERK_TARGET_DIR=/build \
            -v "$PWD/corpus:/work:ro" \
            -w /work \
            "$IMAGE" \
            clerk test --color=never $FILES
