name: Vérification du corpus Catala

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "scripts/check-corpus-pr.ts"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: corpus-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      step: ${{ steps.check.outputs.step }}
      status: ${{ steps.check.outputs.status }}
      excerpt: ${{ steps.check.outputs.excerpt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Contrôler le corpus (N1 et N2)
        id: check
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT

          finish() {
            local verdict=$1 step=$2 status=$3 excerpt
            excerpt=$(tail -n 30 "$log" | tail -c 4000 | tr -d '\r' | base64 -w 0)
            printf '%s (%s, code %s)\n' "$verdict" "$step" "$status"
            printf '%s' "$excerpt" | base64 -d | sed 's/^/| /'
            printf 'verdict=%s\nstep=%s\nstatus=%s\nexcerpt=%s\n' \
              "$verdict" "$step" "$status" "$excerpt" >> "$GITHUB_OUTPUT"
            exit "$status"
          }

          bun scripts/check-corpus-pr.ts > "$log" 2>&1 || finish REJECTED 'N1 · anti-doublon' "$?"

          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/bugdeloi-catala@sha256:5f3f6572d073596f3f2b4b3b3ac6205f3743a7bf9cf81720c4d46744f7e48328"
          docker pull "$IMAGE" > "$log" 2>&1 || finish FAULT 'Catala 1.3.2 · docker pull' "$?"

          mapfile -d '' -t FILES < <(cd corpus && find . -name '*.catala_fr' -print0 | sort -z)
          status=0
          docker run --rm --pull=never --network=none --read-only \
            --cpus=2 --memory=1g --memory-swap=1g --pids-limit=128 \
            --tmpfs /tmp:rw,nodev,nosuid,size=128m,mode=1777 \
            --tmpfs /build:rw,nodev,nosuid,exec,size=1g,mode=1777 \
            -e CLERK_BUILD_DIR=/build -e CLERK_TARGET_DIR=/build/targets \
            -v "$PWD/corpus:/work:ro" \
            -w /work \
            "$IMAGE" \
            clerk test --color=never "${FILES[@]}" > "$log" 2>&1 || status=$?

          case "$status" in
            0) finish 'ACCEPTED (N2 Compilé)' 'N2 · clerk test' "$status" ;;
            125|126|127) finish FAULT 'Catala 1.3.2 · docker run' "$status" ;;
            *) finish REJECTED 'N2 · clerk test' "$status" ;;
          esac

  comment-verdict:
    needs: corpus-check
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number && needs.corpus-check.outputs.verdict != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERDICT: ${{ needs.corpus-check.outputs.verdict }}
          FAILED_STEP: ${{ needs.corpus-check.outputs.step }}
          EXIT_STATUS: ${{ needs.corpus-check.outputs.status }}
          EXCERPT: ${{ needs.corpus-check.outputs.excerpt }}
        with:
          script: |
            const marker = '<!-- bugdeloi-corpus-verdict -->';
            const { VERDICT, FAILED_STEP, EXIT_STATUS, EXCERPT } = process.env;
            const pr = context.payload.pull_request;
            const issue = { ...context.repo, issue_number: pr.number };
            let body = `${marker}\n**${VERDICT}**`;

            if (EXIT_STATUS !== '0') {
              body += `\n\n${FAILED_STEP} (code ${EXIT_STATUS})`;
              const log = Buffer.from(EXCERPT, 'base64').toString('utf8').trimEnd();
              if (log) body += '\n\n' + log.split('\n').map(line => `    ${line}`).join('\n');
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...issue, per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...issue, body });
              }

              const reviewEvent =
                EXIT_STATUS === '0'
                  ? 'APPROVE'
                  : VERDICT === 'REJECTED'
                    ? 'REQUEST_CHANGES'
                    : 'COMMENT';
              await github.rest.pulls.createReview({
                ...context.repo,
                pull_number: pr.number,
                commit_id: pr.head.sha,
                event: reviewEvent,
                body,
              });
            } catch (error) {
              if (error.status !== 403 && error.status !== 422) throw error;
              core.notice(`Commentaire/approbation ignoré (${error.status}) : ${error.message}`);
            }

  auto-merge:
    needs: corpus-check
    if: ${{ github.event_name == 'pull_request' && needs.corpus-check.outputs.verdict == 'ACCEPTED (N2 Compilé)' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = { ...context.repo, issue_number: pr.number };
            const marker = '<!-- bugdeloi-auto-merge -->';

            async function postMergeNote(message) {
              try {
                const body = `${marker}\n${message}`;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...issue,
                  per_page: 100,
                });
                const existing = comments.find(
                  c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker)
                );
                if (existing) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ ...issue, body });
                }
              } catch (commentErr) {
                core.notice(`Impossible de commenter l'état auto-merge : ${commentErr.message}`);
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const isAllowedAutoMerge = (filename) =>
              (filename.startsWith('corpus/') && filename.endsWith('.catala_fr')) ||
              (filename.startsWith('corpus/analyses/') && filename.endsWith('.md'));
            const blocked = files.filter(f => !isAllowedAutoMerge(f.filename));
            if (files.length === 0 || blocked.length > 0) {
              const msg = `**Auto-merge ignoré** : la PR touche des fichiers hors \`corpus/**/*.catala_fr\` et \`corpus/analyses/*.md\` (${blocked.map(f => `\`${f.filename}\``).join(', ')}). Revue humaine requise.`;
              core.notice(msg);
              await postMergeNote(msg);
              return;
            }
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH,
                    expectedHeadOid: $expectedHeadOid
                  }) {
                    pullRequest { number }
                  }
                }`,
                {
                  pullRequestId: pr.node_id,
                  expectedHeadOid: pr.head.sha,
                }
              );
              core.notice(
                `Auto-merge armé sur PR #${pr.number} : fusion automatique dès que verify, corpus-check et CodeRabbit sont verts.`
              );
            } catch (error) {
              const msg = String(error?.message || '');
              if (msg.includes('Pull request is in clean status')) {
                await github.rest.pulls.merge({
                  ...context.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: pr.head.sha,
                });
                core.notice(`PR #${pr.number} fusionnée immédiatement (tous les contrôles déjà verts).`);
                return;
              }
              if (error.status === 403 && pr.head.repo?.fork) {
                const forkMsg = '**Auto-merge ignoré** : PR issue d’un fork (jeton GitHub en lecture seule).';
                core.notice(forkMsg);
                await postMergeNote(forkMsg);
                return;
              }
              await postMergeNote(`**Auto-merge en échec** : \`${msg}\``);
              throw error;
            }
