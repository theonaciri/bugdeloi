name: Vérification du corpus
on:
  pull_request:
    paths:
      - "corpus/**"
      - "packages/cli/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe65e19d3923be20e52c5ab52ff877f7e4c32 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Contrôle statique du corpus (N1, hygiène, oracles YAML)
        run: bun packages/cli/src/bin.ts check corpus --no-sandbox
      - name: Tests unitaires du CLI bdl
        run: bun test packages/cli/src/
